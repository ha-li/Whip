version: '3'

# Whip builds for macOS only; build/darwin/Taskfile.yml does the platform work.

vars:
  APP_NAME: "Whip"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # App version (semver, e.g. 0.2.0-beta). build/config.yml's info.version is the
  # source of truth; override it for one build with VERSION=... (a task argument,
  # e.g. `wails3 build VERSION=0.2.0-beta`, or an env var, which is how make passes it).
  VERSION:
    sh: 'echo "${VERSION:-$(sed -nE ''s/^  version: "([^"]*)".*/\1/p'' build/config.yml)}"'
  # Stamps VERSION into the binary through -ldflags. Release builds use
  # VERSION_LDFLAG. Dev builds (DEV=true, as `wails3 dev` sets) use
  # VERSION_LDFLAG_DEV, which adds a "dev" pre-release tag:
  # 0.0.1 -> 0.0.1-dev, 0.2.0-beta -> 0.2.0-beta.dev. (DEV isn't visible here,
  # so the darwin BUILD_FLAGS picks the flag in its own DEV branch.)
  # Unstamped builds (plain go build / go run) report 0.0.0-dev.
  VERSION_LDFLAG: '-X github.com/ha-li/Whip/internal/app/version.current={{.VERSION}}'
  VERSION_LDFLAG_DEV: '{{.VERSION_LDFLAG}}{{if contains "-" .VERSION}}.dev{{else}}-dev{{end}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    preconditions:
      - sh: test "{{OS}}" = darwin
        msg: "Whip builds on macOS only."
      # The app exits at launch on an invalid version, so refuse to build one.
      # (make dmg calls the darwin packaging tasks directly; its sync-version step validates.)
      - sh: go run ./cmd/semver "{{.VERSION}}" >/dev/null
        msg: 'VERSION "{{.VERSION}}" is not valid semver (want MAJOR.MINOR.PATCH, optionally -prerelease); check build/config.yml or VERSION=...'
    cmds:
      - task: darwin:build

  package:
    summary: Packages a production build of the application
    cmds:
      - task: darwin:package

  version:
    summary: Prints the app version a build would stamp, failing if it isn't valid semver
    silent: true
    cmds:
      - go run ./cmd/semver -full "{{.VERSION}}"

  run:
    summary: Runs the application
    cmds:
      - task: darwin:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
